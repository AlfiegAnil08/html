<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
        <legend>Student Registration Form</legend>
        <label for="name">Enter Full Name</label>
        <input type="name" id="name" name="name"><br><br>
        <label for="email">Enter Email Address</label>
        <input type="email" id="email" name="email"><br><br>
        <label for="password">Enter Password</label>
        <input type="password" id="password" name="password"><br><br>
        <label for="">Gender</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>
        <label for="course">course</label>
        <select id="course" name="course">
            <option value="physics">Physics</option>
            <option value="chemistry">Chemistry</option>
            <option value="maths">Maths</option>
            <option value="biology">Biology</option>
            <option value="computer science">Computer science</option>
        </select>
        <label for="date of birth">Enter DOB</label>
        <input type="date of birth" id="date of birth" name="date of birth"><br><br>
        <label for="">Hobbies</label>
        <input type="checkbox" id="hobbie" name="hobbie1" value="Travel">
        <label for="hobbie">Travel</label>
        <input type="checkbox" id="hobbie" name="hobbie2" value="Music">
        <label for="hobbie">Music</label>
        <input type="checkbox" id="hobbie" name="hobbie3" value="Yoga">
        <label for="hobbie">Yoga</label><br><br>
        <label for="address">Address:</label><br><br>
        <textarea id="address" name="address" rows="16" col="30"></textarea><br><br>
        <input type="submit" value="submit">
        <input type="reset" value="reset">

        

    </form>
</fieldset>
</body>
</html>
