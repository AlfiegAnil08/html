<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="formt.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Form</h1>
    <form>
<label for="user">Enter username:</label>
<input type="text" id="user" name="username"><br><br>
<label for="mail">Enter email:</label>
<input type="email" id="mail" name="email"><br><br>
<label for="p">Enter password:</label>
<input type="password" id="p" name="pass" required placeholder="enter password"><br><br>
<label for="ph">Enter Phone No:</label>
<input type="tel" id="ph" name="ph"><br><br>
<label for="dob">Enter Date Of Birth:</label>
<input type="date" id="dob" name="dob"><br><br>
<label for="address">Enter Address:</label>
<textarea id="address" rows="4" col="30"></textarea><br><br>
<label for="">Gender:</label>
<input type="radio" id="M" name="gender" value="Male">
<label for="M">Male</label>
<input type="radio" id="F" name="gender" value="Female">
<label for="F">Female</label><br><br>
<input type="submit" value="submit">
<input type="reset" value="reset">
</form>
</body>
</html>
